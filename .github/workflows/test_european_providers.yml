name: Test European Providers (temporal)

on:
  workflow_dispatch:
    inputs:
      ticker_euronext:
        description: 'Ticker Euronext (default AI.PA)'
        required: false
        default: 'AI.PA'
      ticker_xetra:
        description: 'Ticker Xetra (default SAP.DE)'
        required: false
        default: 'SAP.DE'

jobs:
  test-download:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pycryptodome websocket-client

      - name: Run test script
        run: python scripts/test_european_providers.py
        env:
          TICKER_EURONEXT: ${{ github.event.inputs.ticker_euronext }}
          TICKER_XETRA: ${{ github.event.inputs.ticker_xetra }}
