name: Update Macro Manual (FRED, diario)

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC diario
  workflow_dispatch:

concurrency:
  group: update_macro_manual
  cancel-in-progress: false

jobs:
  update-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar actualizacion macro manual
        run: python scripts/update_macro_manual.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro_manual
          if git diff --staged --quiet; then
            echo "No hay cambios en macro_manual."
          else
            git commit -m "Update macro_manual (FRED automatico)"
            git push
          fi
