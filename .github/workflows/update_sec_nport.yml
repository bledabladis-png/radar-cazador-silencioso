name: Actualizar SEC N-PORT (trimestral)

on:
  schedule:
    - cron: '0 6 20 1,4,7,10 *'  # 20 enero, abril, julio, octubre (último trimestre cerrado)
  workflow_dispatch:

concurrency:
  group: update_sec_nport
  cancel-in-progress: false

jobs:
  update-nport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: pip install requests pandas openpyxl

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Obtener último trimestre cerrado
        id: quarter
        run: |
          MONTH=$(date +%m)
          YEAR=$(date +%Y)
          case $MONTH in
            01|02|03) Q="$((YEAR-1))q4" ;;
            04|05|06) Q="${YEAR}q1" ;;
            07|08|09) Q="${YEAR}q2" ;;
            10|11|12) Q="${YEAR}q3" ;;
          esac
          echo "quarter=$Q" >> $GITHUB_ENV

      - name: Ejecutar actualización N-PORT
        run: python scripts/update_sec_nport_data.py --quarter ${{ env.quarter }}

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/history/sec_nport_*
          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar N-PORT ${{ env.quarter }}"
            git push
          fi
