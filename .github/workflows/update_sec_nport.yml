name: Actualizar SEC N-PORT (trimestral)

on:
  schedule:
    - cron: '17 6 20 1,4,7,10 *'  # 20 enero, abril, julio, octubre a las 06:17 UTC (último trimestre cerrado)
  workflow_dispatch:

concurrency:
  group: update_sec_nport
  cancel-in-progress: false

jobs:
  update-nport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Ejecutar actualización N-PORT
        run: python scripts/update_sec_nport_data.py

      - name: Regenerar cambios trimestrales agregados
        run: python data/providers/sec_nport_quarters_position_change.py

      - name: Regenerar flujo de participaciones QQQ (NPORT-P B.6)
        run: python data/providers/qqq_nport_flow.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/history/sec_nport_*
          git add outputs/history/qqq_nport_flow.csv
          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar N-PORT ${{ env.quarter }}"
            git pull --rebase origin main
            git push
          fi
