name: Cron Probe (temporal)

# Workflow temporal para verificar si GitHub Actions dispara el cron
# '17 3 * * *' de forma fiable. Finding 2026-09-27: el slot '17 3' de
# daily_run.yml no ha disparado desde el deploy del multi-slot
# (commit 3642038, 2026-09-25).
#
# Uso: observar durante 48h. Si dispara consistentemente, el problema
# es de interaccion con daily_run.yml (concurrency u otro). Si NO
# dispara nunca, es GitHub dropeando ese cron concreto.
#
# Eliminar cuando el diagnostico este cerrado.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Log timestamp
        run: |
          echo "PROBE-FIRED-AT: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "EVENT: ${{ github.event_name }}"
          echo "SCHEDULE: ${{ github.event.schedule }}"
