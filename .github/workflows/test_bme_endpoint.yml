name: Test BME Endpoint (temporal)

on:
  workflow_dispatch:

jobs:
  test-bme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run BME endpoint verification
        run: python scripts/verify_bme_endpoint.py
