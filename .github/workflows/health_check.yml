name: Health Check (semanal)

on:
  schedule:
    # Lunes 07:00 UTC. Despues de todos los cron del fin de semana.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q scripts/health_check.py

      - name: Run health check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/health_check.py