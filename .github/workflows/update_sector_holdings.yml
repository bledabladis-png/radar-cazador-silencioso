name: Actualizar ETF Holdings (trimestral)

on:
  schedule:
    - cron: '0 3 1 1,4,7,10 *'   # 1 enero, 1 abril, 1 julio, 1 octubre a las 03:00 UTC
  workflow_dispatch:               # permite ejecución manual desde GitHub

concurrency:
  group: update_sector_holdings
  cancel-in-progress: false

jobs:
  update-holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Instalar dependencias
        run: pip install requests pandas openpyxl

      - name: Validate Python syntax
        run: python -m compileall -q .
      
      - name: Ejecutar actualización de holdings
        run: python scripts/update_sector_holdings.py
      
      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/etf_holdings.csv
          if git diff --cached --quiet; then
            echo "No hay cambios en los holdings."
          else
            git commit -m "Actualizar etf_holdings.csv (automático trimestral)"
            git push
          fi
