name: Daily Macro Sectorial Run

on:
  schedule:
    # F-IAE-CRON-02 (2026-09-25): 4 slots con idempotencia por cobertura.
    # Sustituye al cron unico 0 23 * * * (F-IAE-CRON-01).
    # Razon: la latencia de Yahoo para poblar Close varia (>5h26m observado
    # a 100% NaN, 16h12m a 0% NaN). Un solo deadline no garantiza exito.
    # Los 4 slots apuntan a la misma target_session (ver pipeline_gate.py):
    #   slot 1: 17 23 * * *  (~5h17m post-cierre USA)
    #   slot 2: 17 3 * * *   (~9h17m)
    #   slot 3: 17 7 * * *   (~13h17m)
    #   slot 4: 17 11 * * *  (~17h17m, ultimo intento)
    # Minutos en :17 (evitar :00, franja de alta carga documentada por GitHub).
    - cron: '17 23 * * *'
    - cron: '17 3 * * *'
    - cron: '17 7 * * *'
    - cron: '17 11 * * *'
  workflow_dispatch:

concurrency:
  # F-IAE-CRON-02: queue: max permite hasta 100 pendientes y evita que un
  # slot sustituya al anterior. Incompatible con cancel-in-progress.
  # Dispatches manuales comparten cola con schedule (seguro, no concurrente).
  group: daily-run
  queue: max

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      state: ${{ steps.gate.outputs.state }}
      should_run: ${{ steps.gate.outputs.should_run }}
      expected_session: ${{ steps.gate.outputs.expected_session }}
      is_last_slot: ${{ steps.gate.outputs.is_last_slot }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gate
        id: gate
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/pipeline_gate.py --slot "${{ github.event.schedule }}"

  run-system:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache data/cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-v2-${{ runner.os }}-${{ hashFiles('data/index_holdings.csv', 'data/etf_holdings.csv') }}
          restore-keys: |
            data-cache-v2-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Run tests
        run: pytest tests/ validation/ -v
      - name: Run pyflakes (warnings only)
        run: |
          mkdir -p outputs/audit
          python -m pyflakes . > outputs/audit/pyflakes_report.txt 2>&1 || true
          echo "Pyflakes report generated."
          cat outputs/audit/pyflakes_report.txt

      - name: Calculate QQQ returns from Yahoo
        run: python scripts/qqq_returns_yahoo.py

      - name: Check index_holdings duplicates
        run: |
          python -c "import pandas as pd; df=pd.read_csv('data/index_holdings.csv'); dups=df.duplicated(subset=['etf','ticker']).sum(); print(f'Duplicados: {dups}'); import sys; sys.exit(1 if dups else 0)"

      - name: Update commodities (OilPriceAPI, best-effort)
        env:
          OIL_PRICE_API: ${{ secrets.OIL_PRICE_API }}
        run: python scripts/update_futures.py || echo "Commodities fetch failed, continuing"

      - name: Update CBOE (VIX3M, best-effort)
        run: python scripts/update_cboe.py || echo "CBOE fetch failed, continuing"

      - name: Restore cache parquets 13F (IAE)
        id: cache_13f
        uses: actions/cache/restore@v4
        with:
          path: data/sec_13f/processed
          key: 13f-processed-v2-${{ hashFiles('data/sec_13f/latest_quarter.txt') }}
          restore-keys: |
            13f-processed-v2-
          fail-on-cache-miss: false

      - name: Avisar si cache IAE no disponible
        if: steps.cache_13f.outputs.cache-hit != 'true'
        run: |
          echo "::warning::Cache 13F no disponible. Seccion IAE mostrara STALE."

      - name: Fetch LSE scraper (best-effort)
        id: lse_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: bledabladis-png/lse-close-scraper
          token: ${{ secrets.LSE_SCRAPER_TOKEN }}
          path: data/external/lse_close
          sparse-checkout: datos
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Capture LSE scraper SHA
        if: steps.lse_checkout.outcome == 'success'
        run: |
          SHA=$(git -C data/external/lse_close rev-parse HEAD)
          echo "LSE_SCRAPER_COMMIT=${SHA}" >> "$GITHUB_ENV"
          echo "[LSE] source_commit=${SHA}"

      - name: Run Macro Sectorial
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python run.py

      - name: Regenerar catalogo radar (IAE)
        if: success()
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python scripts/regenerate_radar_catalog.py

      - name: QQQ SEC vs NPORT-P cross validation
        run: python validation/qqq_sec_nport_cross_validation.py

      - name: Verify leader selection
        run: python validation/verify_leader_selection.py

      - name: Cross provider validation
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python validation/cross_provider_validation.py

      - name: Upload artifacts (downloadable report)
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: |
            outputs/report/reporte_diario.md
            outputs/report/sector_rankings.csv
            outputs/report/analisis_lideres.csv
            outputs/report/analisis_lideres_internacionales.csv
            outputs/history/macro_regime.csv
            outputs/history/pcr_history.csv
            outputs/history/darkpool_history.csv
            outputs/history/etf_primary_flow.csv
            outputs/history/blackrock_dax_primary_flow.csv
            outputs/history/blackrock_isf_primary_flow.csv
            outputs/history/amundi_lyxi_primary_flow.csv
            outputs/history/blackrock_iwm_historical.csv
            outputs/history/cftc_position_flow.csv
            outputs/history/sec_nport_positions.csv
            outputs/history/sec_nport_position_change_quarterly.csv
            outputs/history/sec_fund_flow.csv
            outputs/history/slpm_history.csv
            outputs/history/invesco_qqq_nav_historical.csv
            outputs/history/invesco_qqq_nav_business_days.csv
            outputs/history/invesco_qqq_snapshot.csv
            outputs/state/slpm_state.json
            outputs/state/mte_state.json
            outputs/state/liquidity_state.json
            outputs/audit/cross_provider_validation.csv
            outputs/audit/pyflakes_report.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload download failures artifact
        uses: actions/upload-artifact@v4
        with:
          name: download-failures
          path: outputs/audit/download_failures.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload european coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: european-coverage
          path: outputs/audit/european_coverage.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Check download failures alert
        run: |
          if [ -f outputs/audit/download_failures.md ]; then
            echo "[WARN] ALERTA: se detectaron fallos de descarga."
            echo "-------------------------------------------"
            cat outputs/audit/download_failures.md
            echo "-------------------------------------------"
            echo "::warning::Se detectaron fallos de descarga. Revisar artifact download-failures."
          else
            echo "[OK] Sin fallos de descarga."
          fi

      - name: Validate history quality
        run: python validation/validate_history_quality.py

      - name: Monitor double counting
        run: python validation/monitor_double_counting.py || echo "Monitoreo double counting no disponible"


      - name: Guard coverage
        run: python scripts/guard_coverage.py --threshold 0.95

      - name: Commit and push hist/state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "=== status BEFORE git add ==="
          git status --porcelain
          git add -u
          git add -u outputs/history outputs/state
          git add data/commodities_futures.parquet \
            data/commodities_futures.parquet.manifest.json \
            data/commodities_spot.parquet \
            data/commodities_spot.parquet.manifest.json \
            data/cboe_vix3m.parquet \
            data/cboe_vix3m.parquet.manifest.json \
            data/market_data.parquet.manifest.json \
            data/stock_prices.parquet.manifest.json
          git add data/mappings/radar_target_catalog.csv
          git add data/mappings/catalog_manifest.json
          git add data/mappings/catalog_snapshots/
          git add data/lse_close_provenance.json 2>/dev/null || true
          echo "=== status AFTER git add ==="
          git status --porcelain
          UNTRACKED=$(git status --porcelain | grep -E '^\?\? (outputs/history|outputs/state)/' || true)
          if [ -n "$UNTRACKED" ]; then
            echo "ERROR: untracked files in outputs/history or outputs/state after git add:"
            echo "$UNTRACKED"
            exit 1
          fi
          if ! git diff --staged --quiet; then
            git commit -m "Daily hist/state "
            git pull --rebase origin main
            git push
          fi

  issue-manager:
    # F-IAE-CRON-02 (2026-09-25): post-run manager de Issues.
    # Diseño aprobado auditor externo. Corre siempre (siempre que gate
    # haya pasado), incluso si run-system skip o falla.
    #   CURRENT                      -> cerrar issue si existe
    #   READY + success              -> cerrar issue si existe
    #   READY + failure/cancelled    -> NOOP (dejar abierto)
    #   NOT_READY + last_slot + sch  -> abrir o comentar issue
    #   ERROR + last_slot + sch      -> abrir o comentar issue
    #   dispatch manual              -> nunca abre; puede cerrar
    needs:
      - gate
      - run-system
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Manage issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SESSION: ${{ needs.gate.outputs.expected_session }}
          GATE_STATE: ${{ needs.gate.outputs.state }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          IS_LAST_SLOT: ${{ needs.gate.outputs.is_last_slot }}
          RUN_SYSTEM_RESULT: ${{ needs.run-system.result }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: python scripts/issue_manager.py