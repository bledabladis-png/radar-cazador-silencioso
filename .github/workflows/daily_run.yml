name: Daily Macro Sectorial Run

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-system:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Macro Sectorial
        run: python run.py

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/reporte_diario.md outputs/macro_regime.csv outputs/sector_rankings.csv
          git diff --staged --quiet || (git commit -m "Daily report $(date +'%Y-%m-%d')" && git push)
