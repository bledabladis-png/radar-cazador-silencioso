name: Daily Macro Sectorial Run

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  run-system:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Macro Sectorial
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python run.py

      - name: Upload artifacts (downloadable report)
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: |
            outputs/reporte_diario.md
            outputs/macro_regime.csv
            outputs/sector_rankings.csv
            outputs/analisis_lideres.csv
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/reporte_diario.md outputs/macro_regime.csv outputs/sector_rankings.csv
          git add outputs/analisis_lideres.csv 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Daily report " && git push)
