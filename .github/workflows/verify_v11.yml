# Verificacion forzada de la enmienda v1.1.
# Ejecuta run.py real (descarga de Yahoo/FRED/etc, produce parquets en
# el runner). NO incluye el paso "Commit and push hist/state", por lo
# que el repo no se contamina. Los parquets viven solo en el runner
# (data/market_data.parquet esta gitignored de todas formas).
#
# Lo que se verifica (camino completo desde cero con target_session
# nuevo): gate no interviene, pipeline corre real, guard evalua
# contratos, receipt se emite con contract_validation_status,
# attempt registra SUCCESS/BLOCKED.
#
# Referencia: docs/auditoria/daily_run_gate_contrato_v1.md +
# docs/auditoria/daily_run_gate_enmienda_v1_1.md
name: Verify v1.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify_v11
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve target session
        id: target
        run: |
          T=$(python -c "from src.market_calendar import last_expected_market_date; from datetime import datetime, timezone; print(last_expected_market_date(datetime.now(timezone.utc)).isoformat())")
          echo "target_session=$T" >> $GITHUB_OUTPUT
          echo "Target session: $T"

      - name: Run pipeline (real, from scratch)
        run: python run.py

      - name: Guard coverage
        run: python scripts/guard_coverage.py --threshold 0.95

      - name: Write completion receipt
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/write_completion_receipt.py

      - name: Write completion attempt (always)
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TARGET_SESSION: ${{ steps.target.outputs.target_session }}
        run: python scripts/write_completion_attempt.py

      - name: Upload receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verify-v11-receipt-${{ steps.target.outputs.target_session }}
          path: outputs/state/completion_receipt.json

      - name: Upload attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-v11-attempt
          path: outputs/state/completion_attempt.jsonl

      - name: Upload report + manifests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verify-v11-report
          path: |
            outputs/report/
            data/market_data.parquet.manifest.json
            data/stock_prices.parquet.manifest.json

      - name: Confirm no contamination
        if: always()
        run: |
          echo "=== git status ==="
          git status -sb
          echo "=== git log ==="
          git log --oneline -3
          echo "=== tracked parquets in data/ ==="
          git ls-files data/ | grep -E '\.parquet$' || echo "(ninguno)"