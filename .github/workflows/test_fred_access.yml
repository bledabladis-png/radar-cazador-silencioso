name: Test FRED Access (temporal)

on:
  workflow_dispatch:

jobs:
  test-fred:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pandas-datareader

      - name: Run FRED verification
        run: python scripts/verify_fred_access.py
