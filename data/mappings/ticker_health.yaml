schema_version: 1
# Fuente canonica de exclusiones por evento corporativo.
# Estados validos: ACTIVE (default, no listar), DELISTED, STALE, TRUNCATED_IPO.
# - DELISTED: activo no existe. Excluido del universo (get_stock_list,
#   p1_h02, breadth).
# - STALE: sin datos recientes, no confirmado. WARN, no excluido.
# - TRUNCATED_IPO: IPO reciente. No alerta.
# Cualquier exclusion hardcodeada en codigo es deuda: debe vivir aqui.

tickers:
