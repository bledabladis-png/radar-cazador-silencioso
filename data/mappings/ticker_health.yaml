      J5A.DU, J5A.HM, J5A.HA), todos terminan 2026-10-05. SKYD es la
      entidad fusionada (ticker y marketCap distintos, sin continuidad
      de CUSIP).'
    reabrir_si: 'Yahoo sirve precios post-2026-10-06 bajo WBD; o SKYD
