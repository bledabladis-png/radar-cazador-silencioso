# Expansiones declarativas del universo de descarga.
#
# DICT3-TOP20-COBERTURA: la cobertura de holdings por grupo se limita al
# top-N por peso (TOP_N_SECTOR_COMPONENTS = 20). Para grupos con cola larga
# (XLI, SPY, IWM) el top-20 no alcanza el 80-90% del peso. Este fichero
# declara tickers adicionales por grupo, descargados SIEMPRE sin cambiar
# TOP_N_SECTOR_COMPONENTS (que sigue controlando el corte global).
#
# Reglas:
# - Solo tickers que NO estan ya cubiertos por las fuentes 1-4 de
#   get_stock_list() (top-20 sector, top-20 indice, catalogo radar,
#   providers europeos).
# - Cada bloque documenta: fecha, cobertura top-20 actual, cobertura
#   objetivo, cobertura tras expansion, y los tickers anadidos.
# - Cambios requieren test en tests/test_universe_expansions.py.
#
# Fuente del calculo: data/etf_holdings.csv, ordenado por weight desc.
#
# Metricas de cobertura:
# - cobertura_top20_actual: peso del top-20 actual (antes de la expansion).
# - cobertura_top20_mas_extra: peso de (top-20 UNION tickers de este
#   bloque). Verificable contra etf_holdings.csv sin depender de parquet.
#   Es la cobertura que aporta ESTE fichero de forma aislada.
# - cobertura_tras_expansion: peso del top-50 XLI completo. Tras la
#   descarga, el parquet contendra los 50 (22 ya existentes + 28 nuevos).
#   Es la cobertura efectiva del grupo en el sistema.

xli_extra:
  etf: XLI
  fecha: "2026-10-26"
  cobertura_top20_actual: 57.17
  cobertura_top20_mas_extra: 86.15
  cobertura_tras_expansion: 88.99
  cobertura_objetivo: 80.00
  n_tickers: 28
