- id: SOW-BEAR-CONFIRMATION
  tipo: frente
  ciclo: '2026-10-24'
  estado: IN_PROGRESS
  descripcion: |
    Nuevo frente tras cierre del SOW universal (SOW-V6 -> WONT_FIX).
    El patron bear es real: 3/3 anos con >10% dias bear funcionan (2018,
    2020, 2022; 2025 en el limite con 8.8%), 0/5 anos con <10% bear
    funcionan. Evidencia en docs/auditoria/wyckoff/56_event_study_2026-10-24/.
    SOW-BEAR-CONFIRMATION no es una senal autonoma. Es una confirmacion
    de deterioro DENTRO de un regimen bear ya identificado por el sistema
    (market proxy < MA200 AND drawdown desde maximo 252d < -10%). No
    activa DISTRIBUTION por si solo. Anade una etiqueta de confirmacion
    al reporte en sectores que ya cumplen regimen bear.
  plan: |
    (1) Nuevo contrato semantico v1.10: define SOW-BEAR-CONFIRMATION con
        semantica de etiqueta de confirmacion, no fase. SOW v1.8 (evento
        de ruptura) se mantiene intacto. SOW v2 (gate distribution) se
        reutiliza como condicion necesaria pero no suficiente.
    (2) Regla de activacion: solo emite la etiqueta si market proxy esta
        en bear (MA200 + DD) Y SOW v2 dispara en las ultimas M sesiones.
