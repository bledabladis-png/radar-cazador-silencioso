    API (con lag de ~5 dias) sobre los CSVs de data/macro_manual/
    (pusheados por bot diario, cron 17 6 * * *). Evidencia: FRED API
    devolvia datos hasta 2026-10-14 mientras sofr.csv tenia hasta
    2026-10-19 y rrpp.csv hasta 2026-10-20. liquidity.py leia fed_data
    del router, calculaba edad contra 2026-10-14 y marcaba sofr y
