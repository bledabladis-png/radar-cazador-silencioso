  evidencia: 'Tres tests nuevos (imports, fetch-depth, attempt-sin-duplicar) corren
    en la suite normal. Ademas se ha anadido .github/workflows/ci_tests.yml que ejecuta
    la suite completa en cada push a main (paths-ignore: data/, outputs/), independiente
    del gate. Verificado en el run 39000723877 (event=push, 3551 passed + 33 skipped
    + 9 deselected en 1m51s). Cierra el ciclo: los tests entran en CI en cada push,
    sin esperar al proximo target_session.'
