- id: DICT3-H04-INTERVALS
  tipo: deuda_tecnica
  ciclo: '2026-10-25'
  estado: OPEN
  descripcion: |
    H-04 del dictamen externo: la metrica structure_ratio (continuo,
    publicado en sector_regime_matrix v2 desde Bloque 2) no tiene
    intervalos de confianza por cohorte anual, tamanos muestrales
    por estado, criterios de inclusion explicitos, ni tratamiento de
    observaciones solapadas / correlacion entre sectores. Sin esto,
    la metrica es descriptiva, no inferencial. Doc 68 seccion H-04.
  siguiente_accion: |
    2026-10-26 (post-dictamen externo H-04): DICTAMEN RECIBIDO.
    Veredicto: NO APROBADO para publicar IC95 como inferencia validada.
    Mantener OPEN. structure_ratio aceptada como descriptiva.

    5 hallazgos aceptados (todos en doc 73 seccion 1):
      P0-H04-01 bootstrap mal especificado: unidad remuestreada ambigua
        (ratio[y,s] vs observaciones diarias), identidad de sector no
        preservada, dependencia temporal dentro de cada ano no
        demostrada. El protocolo §2-§10 no aporta informacion suficiente
        para validar la implementacion. No afirmacion de que el codigo
        real este mal: afirmacion de que el protocolo no lo demuestra.
      P0-H04-02 cinco anos no son base solida. Tres completos + dos
        parciales. Variacion estructural 0.784->0.212 requiere justificar
        interpretacion comun.
      P0-H04-03 criterio §9 no discrimina por construccion. Declarado
        metodologicamente no concluyente. NO se reinterpreta como
        superado. NO se reemplaza por 0.5 post hoc.
