- id: SOW-V6
  tipo: frente
  ciclo: '2026-10-06'
  estado: WONT_FIX
  descripcion: |
    Validacion del SOW universal (C1-M5, gate distribution). 7 experimentos
    sobre datos historicos, 2 cohortes reservadas (268 y 3423 tickers),
    2 detectores (v1 y v2), 2 estimadores (pooled y within-ticker),
    2 placebos (permutacion y distribucion de 100 shifts). Evidencia en
    docs/auditoria/wyckoff/51-56.
  razon: |
    El detector SOW v2 tiene senal real vs placebo (lift real +0.123 vs
    placebo mean -0.077, sd 0.009, 21.5 sd de separacion) pero NO es
    universal: 4/9 folds positivos, IC95 entre anos [-0.058, +0.303] cruza 0.
    Patron: 3/3 anos con >10% dias bear funcionan (2018, 2020, 2022, 2025
    con 2025 en el limite), 0/5 anos con <10% bear funcionan. 2020 domina
    la muestra bear (473/671 SOW en bear). Ningun gate probado (VIX>60,
    market<MA200+DD<-10%) cumple el criterio pre-registrado: ambos bajan
    la media global (+0.217 -> +0.104 y +0.217 -> +0.126). El SOW universal
    muere como senal autonoma. Cierre de validacion, no de hipotesis:
    el patron bear real justifica un frente distinto (SOW-BEAR-CONFIRMATION).
  siguiente_accion: |
    Ninguna. Frente cerrado. Reabrir solo con nuevo contrato (bear-confirmation)
    o nueva variable Y.

