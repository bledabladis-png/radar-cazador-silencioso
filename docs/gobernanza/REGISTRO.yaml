    colateral OutputSpec.date_source='upstream' para outputs con
    lag, notas B2-B10, tests 3251->3253, commits
    3542d29d..8b441a7a. Commit be280bc1.

    Poda aplicada: py scripts/poda_bitacora.py --apply elimino
    solo 2026-10-13 (lineas 1519-1563). Hash pre 33f77ca8d78bb1c5,
    hash post 8439369fb70506e5, 69381 bytes. --check post:
    [OK] Bitacora dentro de la regla (11 sesiones unicas, keep=10
    + dia en curso).

    Cierre documental en commit posterior a b52df895.
  descripcion: |
    La regla §5 de 05_BITACORA.md dice: "mantiene las ultimas 10
    sesiones. Ademas, siempre conserva las del dia en curso, aunque
    superen 10". Ambiguedad: "aunque superen 10" puede leerse como
    (a) 10 dias totales incluyendo el dia en curso, o (b) 10 dias
    fuera del dia en curso + dia en curso aparte.

    El script scripts/poda_bitacora.py decide() implementaba (a):
    range(min(keep_n, len(grupos))) conservaba los primeros 10
    grupos sin eximir el dia en curso. Con 11 dias unicos
    (2026-10-24 x2 + 10 previos) queria podar 2026-10-13.

