- id: CI-PREVENTION-GAP
  tipo: auditoria_interna
  ciclo: '2026-10-17'
  estado: FIXED
  descripcion: No existia ningun mecanismo que validara el codigo en CI antes del
    push. Los dos fallos de 2026-10-16/17 (import yaml sin pyyaml en requirements,
    y actions/checkout con shallow clone incompatible con tests contractuales) solo
    se detectaban despues del push, o cuando el gate del daily_run decidia ejecutar
    el pipeline.
