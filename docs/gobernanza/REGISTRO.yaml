    confirmatorio. La validacion confirmatoria requiere datos futuros
    o muestra independiente definida antes de mirar resultados.
  siguiente_accion: |
    Cuatro decisiones de diseno antes de codigo:
    (1) Estimando: ventana observada vs poblacion de anos vs
        regimenes futuros. El pre-registro actual mezcla los tres.
        Elegir uno, justificar.
    (2) Remuestreo: unidad en cada dimension, identidad del sector,
        dependencia temporal dentro de ano, tratamiento de anos
        parciales/sectores ausentes, ponderacion (por dia vs por
        ano) coherente con estimando.
    (3) Criterio discriminante: test de equivalencia (TOST) o
        contraste contra referencia justificada. Distinguir
        evidencia insuficiente de evidencia de equivalencia. No
        basta con IC contiene/excluye.
    (4) Validacion independiente: propuesta usar 2027 como holdout
        prospectivo, con protocolo congelado antes de 2027-01-01.
    Sin codigo hasta aprobacion del diseno por auditor externo.
    Bloqueante suave: no afecta uso descriptivo actual de
    structure_ratio.

