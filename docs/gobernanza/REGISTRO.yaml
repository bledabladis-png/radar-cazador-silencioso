- id: REP-AUDIT-20261020-REPORT-REVIEW-EXTERNAL
  tipo: auditoria_interna
  ciclo: '2026-10-20'
  estado: OPEN
  descripcion: |
    Revision externa del reporte 2026-10-19 identifico 14 inconsistencias.
    Las 4 criticas se confirman y se arreglan en esta misma rama
    (STRESS-LABEL, XLC-EVIDENCE, FLOW-RECONCILIATION, STRUCT-COLUMN).
    C1 (Wyckoff +1) = FALSE_POSITIVE del analista - el sesgo ya esta
    declarado en evidencia_matrix.py:35 (WONT FIX razonado) y en la
    nota H9 del reporte L687. C2 (Flow Proxy 30% WLS) = FALSE_POSITIVE
    parcial - el 30% es real pero el r=0.015 es correlacion de SIGNOS
    contemporaneos, no de z-scores continuos; el WLS ordena calidad de
    liderazgo, no predice retorno. C4 (datos desfasados) = FALSE_POSITIVE -
    todos los CSVs tienen lag de proveedor esperado (FINRA 21d, CFTC 6d,
    SSGA 3d, N-PORT 60d desde cierre Q2). C5 (NIPC 13F) = FALSE_POSITIVE -
    BALANCE esta en acciones por diseno del dato N-PORT. C6 (Europa
    ~0.00% AUM) = FALSE_POSITIVE parcial - los CSV declaran
    flow_zscore_regime SATURATED/MAD0; el agregado no lo destaca al
    lector, limitacion de presentacion. C7 (spread 10Y-3M) = FALSE_POSITIVE
    del analista - su cifra ~109pb es de prensa, FRED marca 0.83 el
    16-10 y 0.88 el 19-10. C9 (IPI diluye shocks) = FALSE_POSITIVE - la
    nota L145 del reporte ya declara proxy de mercado, comprimidos con
    tanh, EWMA(20), puede divergir de IPC/PPI sin ser error. C10 (DXY/EEM
    +2.65 sin comentar) = FIXED en este commit. C3 (SLPM NO_LEADERS) = FALSE_POSITIVE del analista - la lista leader_metrics esta vacia porque no hay tickers en fase MARKUP/ACCUMULATION en el sector #1 (XLP en RANGE); el reporte ya lo declara con ADVERTENCIA explicita en L318. El analista confunde 'bloque de lideres publicado' (XLK, XLE en MARKUP) con 'liderazgo confirmado por SLPM' (0/5). C6 (Europa -0.57 como z-score de ruido) = FIXED - nota de materialidad publicada en flows_international.py: la cifra es media simple de z-scores de 3 fondos, no ponderada por AUM, y los flujos tipicos estan por debajo del umbral de materialidad.

    P1 Flow Proxy tabla vs matriz (auditor externo 2026-10-20) = FIXED en
    eaed52a7. Notas aclaratorias en leaders.py y synthesis.py, 2 tests
    nuevos. La tabla usa composite momentum del ETF sectorial; la matriz
    usa sector_concentration.flow_median (mediana del composite de los
    componentes del sector). Son metricas distintas y pueden discrepar en
    signo. P2 trazabilidad temporal CBOE post reference_date = FIXED
    en 68e4e40c. Nota en provenance.py aclara que reference_date es
    referencia de ejecucion, no corte de datos. P2 Wyckoff sin
    trazabilidad publica = FIXED en 68e4e40c. Nota con la regla
    exacta del voto en synthesis.py. P2 mayoria de signos sin
    recuento = FIXED en 68e4e40c. Columna Votos P/N/0 publicada en
    la matriz; counts via row.get con default 0 para no romper tests
    que construyen DataFrames sin n_sector_evidence_*.
  siguiente_accion: |
    Cerrar el item cuando el run 2026-10-20 confirme que los fixes
