    refs/heads/ refs/tags/ despues de cat-file -e. Si el SHA no es
    alcanzable desde ninguna ref, devuelve False. Mensaje de error
    ampliado a "commit no existe o es huerfano (no alcanzable desde
    refs)" con instruccion: actualizar al SHA actual en main o
    reclasificar a WONT_FIX. Test de regresion:
    tests/test_verifica_gobernanza_sha_reachability.py (4 tests).
    Cubre SHA valido, SHA inexistente, PENDING/None y SHA huerfano
    real (creado con commit-tree en repo temporal). Suite completa:
