    SOFR-IORB). Confirmado en run 39528211520 (target 2026-10-20, head de203871): FLS=63/100, SOFR=-0.59, WALCL=1.00 (saturado), CP=0.89. El diagnostico de saturacion se validó end-to-end. Antes |z|>5 en 17.7% de sesiones, tanh saturado 36.4%,
